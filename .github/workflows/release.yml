name: Personal Fork Release

on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, exe: filmcraft,     asset: filmcraft-linux-x86_64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,      exe: filmcraft,     asset: filmcraft-macos-apple-silicon }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    exe: filmcraft.exe, asset: filmcraft-windows-x64 }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.job.target }}

      - name: Install Linux Dependencies
        if: matrix.job.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libwayland-dev libx11-xcb-dev pkg-config libasound2-dev libudev-dev
          
      - name: Build Binary
        run: cargo build --release --target ${{ matrix.job.target }} -p filmcraft

      - name: Package Binary (Unix)
        if: matrix.job.os != 'windows-latest'
        run: |
          cd target/${{ matrix.job.target }}/release
          tar -czf ../../../${{ matrix.job.asset }}.tar.gz ${{ matrix.job.exe }}
          cd ../../..

      - name: Package Binary (Windows)
        if: matrix.job.os == 'windows-latest'
        run: |
          cd target/${{ matrix.job.target }}/release
          Compress-Archive -Path ${{ matrix.job.exe }} -DestinationPath ../../../${{ matrix.job.asset }}.zip
          cd ../../..

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: personal-release-${{ github.sha }}
          name: "Fork Build: ${{ github.sha }}"
          draft: false
          prerelease: true
          files: |
            filmcraft-*.tar.gz
            filmcraft-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
